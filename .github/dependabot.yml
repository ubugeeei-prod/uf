version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/tools/fuzz"
    schedule:
      interval: "weekly"
    # The fuzz workspace reaches uf crates through path dependencies. Dependabot
    # still sees their workspace dependencies as direct, so keep this updater to
    # the external dependency declared in tools/fuzz/Cargo.toml; the root cargo
    # updater owns the main workspace manifest.
    allow:
      - dependency-name: "libfuzzer-sys"
    groups:
      fuzz:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
