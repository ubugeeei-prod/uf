version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/tools/fuzz"
    schedule:
      interval: "weekly"
    # The fuzz workspace reaches uf crates through path dependencies. Keep this
    # updater to dependencies declared directly in tools/fuzz/Cargo.toml; the
    # root cargo updater owns the main workspace manifest.
    allow:
      - dependency-type: "direct"
    groups:
      fuzz:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
