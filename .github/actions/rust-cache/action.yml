name: Persistent Rust cache
description: Keep Cargo downloads and compiled workspace crates between CI runs.
inputs:
  key:
    description: Separate build profiles and concurrent writers.
    required: true
  frontend-jobs:
    description: >-
      rustc frontend threads for the crates this checkout compiles (1: off).
      Jobs that measure compile time or binaries keep 1.
    required: false
    default: "1"
runs:
  using: composite
  steps:
    # Cargo then runs every rustc call through `tools/ci/rustc-wrapper.sh`,
    # which adds the parallel frontend to this checkout's crates only.
    # Dependencies, build-script probes and Cargo's fingerprints are unchanged,
    # so the sticky target disks below stay warm. See "Build speed" in
    # `docs/rust-performance.md`.
    - name: Compile this checkout's crates with the parallel frontend
      if: runner.os != 'Windows' && inputs.frontend-jobs != '1'
      shell: bash
      env:
        UF_RUSTC_FRONTEND_JOBS: ${{ inputs.frontend-jobs }}
      run: sh "$GITHUB_WORKSPACE/tools/ci/parallel-frontend-env.sh"
    - uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
      with:
        key: ${{ github.repository }}-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}
        path: target
        # Recompiled files can keep the same size, which on-change does not detect.
        commit: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
    - uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
      with:
        key: ${{ github.repository }}-cargo-registry-${{ runner.os }}-${{ runner.arch }}
        path: ~/.cargo/registry
        commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
    - uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
      with:
        key: ${{ github.repository }}-cargo-git-${{ runner.os }}-${{ runner.arch }}
        path: ~/.cargo/git
        commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
    - id: target
      shell: bash
      run: |
        if test -f target/.uf-sticky-initialized; then
          echo 'warm=true' >> "$GITHUB_OUTPUT"
        fi
        touch target/.uf-sticky-initialized
    # Seed new disks from the existing cache. save-if=false also prevents the
    # action's cleanup from deleting workspace crates before disk snapshotting.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      if: steps.target.outputs.warm != 'true'
      with:
        save-if: false
