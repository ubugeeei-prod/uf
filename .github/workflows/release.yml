name: Release
run-name: Release ${{ inputs.version }} (${{ inputs.commit }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from the merged release PR
        required: true
        type: string
      commit:
        description: Exact merged commit
        required: true
        type: string
      validation_run:
        description: Successful merge-queue CI run containing the tested archives
        required: true
        type: string
      npm_run:
        description: Successful npm publication and verification run
        required: true
        type: string

permissions:
  contents: read
  actions: read # Inspect validation and npm publication runs.

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  authorize:
    name: Authorize release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: node tools/release/policy.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
          NPM_RUN: ${{ inputs.npm_run }}

  publish:
    name: Publish release
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read # Download the validated queue artifacts.
      contents: write # Create the release, upload assets and create its tag.
      id-token: write # Sign archives with the workflow identity.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: uf-release-*
          merge-multiple: true
          run-id: ${{ inputs.validation_run }}
          github-token: ${{ github.token }}

      - name: Check the release is complete
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          printf '%s\n' "$version" > artifacts/VERSION
          ls -R artifacts

          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-pc-windows-msvc; do
            archive="artifacts/uf-${target}.tar.gz"
            test -f "$archive" || { echo "missing artifact for ${target}" >&2; exit 1; }
            test -f "${archive}.sha256" || { echo "missing checksum for ${target}" >&2; exit 1; }
            (cd artifacts && sha256sum -c "uf-${target}.tar.gz.sha256")
          done
          tools/release/build-manifest.sh artifacts

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the archives
        run: |
          set -eu
          for archive in artifacts/uf-*.tar.gz; do
            [ -f "$archive" ] || continue
            cosign sign-blob --yes \
              --bundle "${archive}.sigstore" \
              "$archive"
          done
          ls -l artifacts/*.sigstore

      - name: Mirror to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UF_RELEASE_BUCKET: uf-releases
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets are not set; the release is on"
            echo "::notice::GitHub Releases only, which is what install.sh uses."
            exit 0
          fi
          tools/release/publish-r2.sh artifacts --latest

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          tag="uf@${version}"
          release_kind_args=()
          case "$version" in
            *-alpha*|*-beta*|*-rc*) release_kind_args=(--prerelease) ;;
          esac
          assets="artifacts/VERSION"
          for file in artifacts/uf-*.tar.gz artifacts/uf-*.tar.gz.sha256 \
                      artifacts/uf-*.tar.gz.sigstore \
                      artifacts/manifest.json artifacts/manifest-*.json; do
            [ -f "$file" ] && assets="${assets} ${file}"
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $assets
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${release_kind_args[@]}"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" --title "uf ${version}" --generate-notes "${release_kind_args[@]}" $assets
          fi


  smoke:
    name: Install from the release
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            installer: sh
          - runner: ubuntu-24.04-arm
            installer: sh
          - runner: macos-15-intel
            installer: sh
          - runner: macos-15
            installer: sh
          - runner: windows-latest
            installer: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: curl | sh
        if: matrix.installer == 'sh'
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          UF_REPO: ${{ github.repository }}
          UF_VERIFY_ORIGIN: require
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          UF_VERSION="$version" sh infra/cloudflare/setup-assets/install.sh
          "$HOME/.local/bin/uf" --version
          "$HOME/.local/bin/ufr" --version
          "$HOME/.local/bin/ufx" --version
      - name: irm | iex
        if: matrix.installer == 'powershell'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          UF_REPO: ${{ github.repository }}
          UF_VERIFY_ORIGIN: require
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME -replace '^uf@', '' }
          $env:UF_VERSION = $version
          pwsh -NoProfile -ExecutionPolicy Bypass -File infra/cloudflare/setup-assets/install.ps1
          & "$HOME/.local/bin/uf.cmd" --version
          & "$HOME/.local/bin/ufr.cmd" --version
          & "$HOME/.local/bin/ufx.cmd" --version
