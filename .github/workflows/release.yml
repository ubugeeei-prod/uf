name: Release

on:
  push:
    tags:
      - "uf@*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the uf@ prefix"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.builder }}
    # Ninety, not sixty, and the difference is one runner rather than the code.
    #
    # `uf@0.0.0-alpha.9` published every package to npm and produced no
    # binaries: `x86_64-apple-darwin` was cancelled at sixty minutes inside its
    # `Package` step, and `Publish release` needs all four targets. That release
    # added the `image` crate tree, and the three other targets paid under two
    # minutes each for the cold cache it caused. `macos-15-intel` paid more than
    # thirty — it was already twice the next slowest at alpha.8 (29.8 against
    # 15.4), because it is the oldest hardware in the fleet and the only target
    # here without an Apple-silicon runner behind it.
    #
    # A cancelled job also never reaches `Post Run Swatinem/rust-cache`, so a
    # build that runs out of time leaves the next one exactly as cold. That is
    # what makes too small a budget worse than slow: it is self-sustaining.
    #
    # This only runs on a `uf@*` tag, so the ceiling costs nothing until it is
    # needed. Why that one target is four times the others is #464, and raising
    # a ceiling is not an answer to it.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Every target `install.sh` can ask for. `builder` is where it is
        # compiled and `runner` is where it is *run* — the same machine for
        # three of them, and deliberately not for the fourth.
        #
        # `macos-15-intel` is the oldest hardware in the fleet and the only
        # target with no Apple-silicon runner behind it. It took 31 to 46
        # minutes across alpha.13 to alpha.15 against 11 to 20 for the other
        # three, and `publish` needs all four, so it was the whole release's
        # critical path — ubugeeei-prod/uf#464. Apple silicon hosts that target
        # with nothing but `--target`, and `package-binaries.sh` only compiles,
        # tars and shasums, so nothing in this job has to execute what it built.
        #
        # Running it is what `verify` below is for, and it stays native.
        include:
          - target: x86_64-unknown-linux-gnu
            builder: ubuntu-latest
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            builder: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            builder: macos-15
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            builder: macos-15
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      # `.cargo/config.toml` routes the Linux targets through the wild linker.
      - if: runner.os == 'Linux'
        run: cargo install wild-linker --version 0.10.0 --locked

      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          # The tag names the version; a workspace that disagrees would ship an
          # archive whose contents do not match the release it is filed under.
          workspace="$(cargo metadata --no-deps --format-version 1 \
            | node -e 'const m=JSON.parse(require("node:fs").readFileSync(0,"utf8"));
                       const p=m.packages.find(x=>x.name==="uf_cli");
                       process.stdout.write(p.version)')"
          if [ "$version" != "$workspace" ]; then
            echo "tag says ${version}, but uf_cli is ${workspace}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          UF_TARGET: ${{ matrix.target }}
          UF_VERSION: ${{ steps.version.outputs.version }}
          UF_CARGO_PROFILE: dist
        run: tools/release/package-binaries.sh

      # Name the version directory rather than globbing it. A glob makes
      # upload-artifact root the artifact at the non-wildcard prefix, so every
      # file arrives under a `<version>/` directory that `publish` does not
      # look in, and the release fails as if the target had never built.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uf-${{ matrix.target }}
          path: dist/release/uf/${{ steps.version.outputs.version }}
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      # The point of the whole workflow is that `curl … | sh` works. Prove it
      # against the archive `build` produced, on this target's own hardware,
      # before anything reaches a release page.
      #
      # A job of its own rather than a step inside `build`, so that where a
      # binary is *compiled* and where it is *run* can differ. They are the same
      # machine for three of the four; see the build matrix for why the fourth
      # is not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-${{ matrix.target }}
          path: dist/release/uf/${{ steps.version.outputs.version }}
      - name: Verify the installer against this archive
        env:
          UF_TEST_RELEASE_DIR: dist/release/uf/${{ steps.version.outputs.version }}
        run: tools/release/test-install.sh

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Keyless Sigstore signing: the job asks GitHub for an OIDC token, and
      # the certificate Fulcio issues carries this workflow's identity. That
      # identity is what `install.sh` checks, so a signature made anywhere else
      # — including by whoever holds the release host — does not verify.
      # There is no signing key to store, rotate, or lose.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Check the release is complete
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          printf '%s\n' "$version" > artifacts/VERSION
          # Before the checks, so a failure below shows what actually arrived.
          ls -R artifacts

          # A release missing one target is not a partial release, it is a 404
          # for everyone on that platform. Refuse to publish one.
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            archive="artifacts/uf-${target}.tar.gz"
            test -f "$archive" || { echo "missing artifact for ${target}" >&2; exit 1; }
            test -f "${archive}.sha256" || { echo "missing checksum for ${target}" >&2; exit 1; }
            (cd artifacts && sha256sum -c "uf-${target}.tar.gz.sha256")
          done
          # setup.uniflowed.dev/metadata/latest.json serves this.
          tools/release/build-manifest.sh artifacts

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign every archive before it is uploaded, so the signature and the
      # artefact reach the release page together. A release whose signature
      # arrives later is a release that installs unverified in the window
      # between.
      #
      # `install.sh` verifies these against the certificate identity of this
      # file, which is what makes the check mean origin rather than transit:
      # the checksum beside an archive comes from the host serving it, and
      # whoever can replace one can replace the other. See
      # ubugeeei-prod/uf#551.
      - name: Sign the archives
        run: |
          set -eu
          for archive in artifacts/uf-*.tar.gz; do
            [ -f "$archive" ] || continue
            cosign sign-blob --yes \
              --bundle "${archive}.sigstore" \
              "$archive"
          done
          ls -l artifacts/*.sigstore

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          tag="uf@${version}"
          release_kind_args=()
          case "$version" in
            *-alpha*|*-beta*|*-rc*) release_kind_args=(--prerelease) ;;
          esac
          assets="artifacts/VERSION"
          for file in artifacts/uf-*.tar.gz artifacts/uf-*.tar.gz.sha256 \
                      artifacts/uf-*.tar.gz.sigstore \
                      artifacts/manifest.json artifacts/manifest-*.json; do
            [ -f "$file" ] && assets="${assets} ${file}"
          done
          # shellcheck disable=SC2086
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" "${release_kind_args[@]}"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $assets
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "uf ${version}" --generate-notes "${release_kind_args[@]}" $assets
          fi

      - name: Mirror to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UF_RELEASE_BUCKET: uf-releases
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets are not set; the release is on"
            echo "::notice::GitHub Releases only, which is what install.sh uses."
            exit 0
          fi
          tools/release/publish-r2.sh artifacts --latest

  smoke:
    name: Install from the release
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The last thing that can still be wrong is the published URLs. Install
      # the way a user does, from the release that was just created.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: curl | sh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          UF_REPO: ${{ github.repository }}
          # `require` refuses an install whose origin nothing established, so
          # this job fails if the signing step above did not produce a bundle
          # that verifies against this workflow's identity. It is the whole of
          # what stops a uf release from shipping with a check that proves only
          # transit — a default of `auto` on a user's machine reports the gap;
          # here it has to be closed.
          UF_VERIFY_ORIGIN: require
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          UF_VERSION="$version" sh infra/cloudflare/setup-assets/install.sh
          "$HOME/.local/bin/uf" --version
          "$HOME/.local/bin/ufr" --version
          "$HOME/.local/bin/ufx" --version
