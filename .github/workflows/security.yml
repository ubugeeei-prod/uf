name: Security

# `merge_group` because `Zizmor` is a required context, and a required check
# that does not run on the queue's speculative merge leaves the queue with
# nothing to wait for. See #588.
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          persona: pedantic
          min-severity: low
          min-confidence: medium
