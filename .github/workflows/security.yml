name: Security

# `merge_group` because `Zizmor` is a required context, and a required check
# that does not run on the queue's speculative merge leaves the queue with
# nothing to wait for. See #588.
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: pedantic
          min-severity: low
          min-confidence: medium
