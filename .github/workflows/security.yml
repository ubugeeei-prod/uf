name: Security

# `merge_group` because `Zizmor` is a required context, and a required check
# that does not run on the queue's speculative merge leaves the queue with
# nothing to wait for. See #588.
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          persona: pedantic
          min-severity: low
          min-confidence: medium
