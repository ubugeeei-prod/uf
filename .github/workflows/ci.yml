name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format:
    name: Format
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: cargo test --workspace

  installer:
    name: Installer
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cargo install wild-linker --version 0.10.0 --locked
      # Packages a release and installs it with the real installer. Keeps
      # install.sh and package-binaries.sh from drifting apart between releases,
      # when the only thing that notices is a user running `curl … | sh`.
      - run: tools/release/test-install.sh

  bench-compile:
    name: Bench Compile
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: cargo bench --workspace --no-run

  metadata:
    name: Metadata
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cargo metadata --format-version 1 --locked
      - run: node -e "JSON.parse(require('node:fs').readFileSync('crates/uf_lib/lib/core/package.json', 'utf8'))"

  upstream-flow:
    name: Upstream Flow
    runs-on: blacksmith-32vcpu-ubuntu-2404
    env:
      # `rust-toolchain.toml` pins 1.98.0 and overrides `rustup default`, so the
      # nightly the toolchain action installs only takes effect through this.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      # The parser, on the *current* nightly. This is the job that tells us when
      # `never_type` stabilizes and `upstream-parser` can become the default, so
      # it deliberately tracks the moving channel. `--all-features` would drag in
      # `upstream-typecheck`, which needs a pinned nightly; that has its own job.
      - run: cargo clippy --workspace --all-targets --features uf_flow/upstream-parser -- -D warnings
      - run: cargo test --workspace --features uf_flow/upstream-parser

  upstream-typecheck:
    name: Upstream Flow Typecheck
    runs-on: blacksmith-32vcpu-ubuntu-2404
    env:
      # Flow's typing crates declare `#![feature(box_patterns)]`, which the
      # compiler *removed* around 2026-09-01. This date is the newest nightly
      # that still accepts it, so the pin is not a preference — a floating
      # `nightly` cannot build the type checker at all. Same `RUSTUP_TOOLCHAIN`
      # trick as above, because `rust-toolchain.toml` overrides `rustup default`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
