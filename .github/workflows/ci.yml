name: CI

# Probe for ubugeeei-prod/uf#1071, not for merge. Only the link probe runs:
# tools/ci/link-probe.sh, on the runner class CI uses and on the arm64 runner
# the aarch64 release is built on.
on:
  pull_request:

permissions:
  contents: read

jobs:
  toolchain:
    name: Toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: tools/ci/link-probe.sh uf

  test:
    name: Test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: tools/ci/link-probe.sh guarantees

  link-probe-arm64:
    name: Link probe arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: link-probe-arm64
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: tools/ci/link-probe.sh guarantees
