name: CI

# `merge_group` as well as `pull_request`, because `main` requires branches to
# be up to date and this pipeline takes about eleven minutes. Those two
# multiply: every merge makes every other open pull request `BEHIND`, so they
# land one at a time, each paying a full pipeline for a base change that did
# not touch it — ten green pull requests is roughly two hours of CI to land
# work that was already green.
#
# A merge queue builds the *result* of merging a batch together, once, and
# merges the batch if that is green. It is also a stronger guarantee than
# `strict`: `strict` proves each branch against the base it was rebased onto
# and never against the other branch merging beside it. The queue only has
# that to build with if the checks it must pass run on `merge_group`, which is
# what this line is. `tools/ci/gate-covers-every-job.sh` holds every workflow
# that reports a required context to it. See #588.
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

# Every job here reads the repository and writes nothing to it. Saying so at
# the top rather than per job means a job added later inherits the narrow
# token instead of the default one.
permissions:
  contents: read

jobs:
  toolchain:
    name: Toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      # Built once and shared, because every job below runs its checks through
      # `uf run` — this repository is a uf project, and its pipeline uses the
      # toolchain it ships rather than a second description of the same checks.
      - run: cargo build --release --bin uf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uf-ci
          path: target/release/uf
          retention-days: 1

  format:
    name: Format
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run rust:fmt:check

  clippy:
    name: Clippy
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run rust:clippy

  test:
    name: Test
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `uf dev` and `uf build` run Vite on a JavaScript host, and the end-to-end
      # tests build the docs site through it, so the workspace's npm packages
      # are installed the way a project's would be.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # `uf build --compile` embeds the build in a Bun runtime, and the two
      # tests that exercise it fail rather than skip when Bun is absent: a
      # single-file build nobody runs is a single-file build nobody has.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun --version
      # Deno runs no uf project — it has no Flow loader — and it is installed
      # here anyway, because `crates/uf_cli/tests/deno_host.rs` is what keeps
      # `uf_runtime::HOSTS`'s Deno row honest: it starts the binary to establish
      # that the gaps the row names are the real gaps, and that the permission
      # set uf translates is one Deno actually enforces. Those tests fail rather
      # than skip when Deno is absent, for the reason the Bun ones do.
      # `v1.x` and not `latest`, because one of those tests is a measurement of a
      # particular Deno rather than of Deno: a global `process` is something a
      # later line may have added, and a test asserting its absence on a version
      # nobody ran it against would be the same unchecked claim in a new place.
      # It gates itself on the major version and says so when it steps aside.
      # Raising this line is the first piece of ubugeeei-prod/uf#246's Deno
      # work, not a maintenance chore.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v1.x
      - run: deno --version
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run rust:test

  flow-format:
    name: Flow format
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `uf fmt` hands the JSON and CSS to the non-Flow formatter, which is a
      # dependency rather than a global install — so the dependencies have to be
      # here even though nothing in this job runs JavaScript.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # `rust:fmt:check` is cargo's half. This is uf's: the formatter this
      # repository ships, over the Flow this repository is written in. It is
      # the only thing that checks the shipped packages' formatting at all.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run fmt:check

  flow-lint:
    name: Flow lint
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `uf lint` reads `uf.config.js`, which imports `@uniflowed/config`, so
      # the dependencies have to be installed even though the linter does not
      # run a line of JavaScript.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # uf is the only thing that can lint uf's own packages, so until this job
      # existed a regression in the linter was invisible to every other check
      # in the pipeline — including to the linter's own Rust tests, which
      # exercise it against fixtures rather than against 322 real files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run check:lib

  docs:
    name: Docs build
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # The documentation site is a uf project in this repository, built by
      # `uf build#docs`. The Docs workflow builds it too, on its own trigger;
      # this job is what makes a pull request that breaks the site fail before
      # it is merged rather than after.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      # `docs:verify` rather than `docs:build`: it builds the site and then
      # runs four checks over that one build, in one task graph, because
      # `uf run` takes one task and `docs:build` is always run — four
      # invocations would build the site four times.
      #
      # `docs:links` is the reason this is not `docs:build` any more. A page
      # that moves takes every link to its old name with it, and each page
      # prerenders on its own, so a dead `<a href>` renders perfectly and
      # 404s when a reader clicks it. Anchors are checked against the ids the
      # markdown pipeline rendered and `sitemap.xml` against the documents
      # that were prerendered — both of which exist only in the output.
      # Offline, so it cannot fail on somebody else's host;
      # `docs:links:external` is the network half and runs on a schedule.
      # See #527.
      #
      # `security:scan` is here rather than in `Metadata` for the same
      # reason: two of its three passes read what `uf build` wrote and what
      # `uf new` writes, and neither exists in a job that does not build. It
      # audits `docs/security.md` against the repository — a row that names a
      # test names one that exists — scans the published output for
      # credential files, well-known token shapes and the build machine's own
      # path, and audits a freshly scaffolded project. See #524.
      - run: ./target/release/uf run docs:verify

  library:
    name: Library
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      # The `@uniflowed/*` packages are Flow, so `cargo test` cannot run a line
      # of them — their tests are uf tests, run by the runner this repository
      # ships. Without this job the library has a suite nothing executes.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run test:lib

  installer:
    name: Installer
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cargo install wild-linker --version 0.10.0 --locked
      # Packages a release and installs it with the real installer. Keeps
      # install.sh and package-binaries.sh from drifting apart between releases,
      # when the only thing that notices is a user running `curl … | sh`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run install:test

  bench-compile:
    name: Bench Compile
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run rust:bench

  metadata:
    name: Metadata
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run rust:metadata
      # Every package manifest, not just one: there are 44 of them now, and a
      # manifest that does not parse is a package that cannot be installed.
      - run: ./target/release/uf run manifests
      # And that `package-lock.json` still describes them. `npm ci` catches
      # this too, but in every job that installs and with a message about a
      # package that job has nothing to do with. See ubugeeei-prod/uf#169.
      - run: ./target/release/uf run lockfile
      # And that the check itself still catches each way a lock falls behind.
      # It reads the two files rather than asking npm to regenerate one, so
      # nothing but these cases says it works.
      - run: ./target/release/uf run lockfile:test
      # And that the patch step in `tools/upstream/sync.sh` still refuses every
      # way a patch to the Flow port could go missing. It is the one check here
      # whose subject fails silently: a dropped patch to a type checker
      # compiles, passes, and changes what `uf check` answers.
      - run: ./target/release/uf run upstream:patches:test
      # And that every shell script in the repository parses under the shell
      # this runner uses. `uf@0.0.0-alpha.8` published all seventeen packages
      # and the release was reported as failed, over a `verify-npm.sh` that
      # dash would not parse and bash would — and bash is `/bin/sh` on the
      # laptop it was written on. `sh -n` reads and does not run.
      # And that the installer's banner fits an eighty-column terminal — the
      # first thing anybody sees from `curl … | sh`, and a line wider than the
      # window wraps without its indent.
      - run: ./target/release/uf run install:banner
      - run: ./target/release/uf run scripts:parse
      - run: ./target/release/uf run scripts:parse:test
      # And that the flake is still one flake that reads one toolchain pin.
      # It was two flakes naming a stable Rust channel for a workspace that
      # only compiles on a pinned nightly, so `nix build` could not have
      # produced a binary and `nix develop` handed a contributor a shell the
      # next line of the README fails in. Nothing said so because the only Nix
      # in CI was `Formal`, which enters a shell and never builds a crate.
      # This half needs no Nix installed, which is why it is here and not only
      # in `nix.yml`: a second `flake.nix` added under `tools/` would not match
      # a path filter naming the root one.
      - run: ./target/release/uf run nix
      - run: ./target/release/uf run nix:test
      # And that the three CI integrations still configure the installer with
      # variables it reads. They are YAML for three systems this repository has
      # no runner for, and the installer is shell; nothing else sees both
      # sides, so a rename there leaves them setting something nothing reads
      # and the failure surfaces as `uf: command not found` in a pipeline
      # belonging to somebody who cannot fix it.
      - run: ./target/release/uf run integrations
      # And that the set that goes to npm is closed under its own
      # dependencies. `@uniflowed/stylex` depends on `@uniflowed/core`, so a
      # release that sends one without the other publishes a package that
      # resolves to nothing. No network, so it belongs here rather than in the
      # pre-tag check alone.
      - run: ./target/release/uf run release:closure
      # And that a package somebody implemented is on its way to npm at all.
      # Ten were not — about 22,000 lines of Flow that `npm install` answered
      # `ETARGET` for — because the manifest is a list somebody adds to.
      - run: ./target/release/uf run publishable
      - run: ./target/release/uf run publishable:test
      # And that the one command the release bootstrap depends on still runs.
      # It is invoked by hand, once, by one person, so a mistake in it costs a
      # round trip and blocks a release — it has cost three. Stubs, so this
      # needs no npm session and no network.
      - run: ./target/release/uf run release:trust:test
      # And the step that moves `latest` after the release, which is run by
      # hand for the same reason: npm exchanges this repository's OIDC
      # id-token for `npm publish` and nothing else. Its guards cannot be
      # exercised against the registry as it is — no `@uniflowed/*` package
      # has a stable release to protect yet, and none is past alpha.9 — so
      # stubs are the only thing that runs them.
      - run: ./target/release/uf run release:promote:test
      # And the bump that every release starts with. Its mistakes are all in
      # the second run — resuming a release, or writing the changelog in the
      # wrong order — so the release that went right does not catch them.
      - run: ./target/release/uf run release:bump:test
      # And that a released version's changelog says what the release contains.
      # alpha.5 went out with twenty-two commits in it and twelve in its notes:
      # the section is written before the branch stops waiting for CI.
      - run: ./target/release/uf run release:changelog
      - run: ./target/release/uf run release:changelog:test
      # And that the gate at the bottom of this file still covers this file.
      # It is red unless every job it names came back `success`, which is what
      # stands between a `Toolchain` that does not compile and an armed
      # auto-merge — but only while its `needs:` names every job, and that is
      # a list somebody has to add to. This reads the workflow and says so
      # when it does not, and checks that every required context is a job
      # that cannot report `skipped`. See #367.
      - run: ./target/release/uf run ci:gate
      - run: ./target/release/uf run ci:gate:test
      - run: ./target/release/uf run ci:semver:test
      - run: ./target/release/uf run ci:runtimes
      - run: ./target/release/uf run ci:runtimes:test

  upstream-integrations:
    name: Upstream Integrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # React's compiler crates, Relay's compiler crates, React Native's codegen
      # and Libraries. Nothing compiles against them yet, so this job is the
      # only thing that would notice a pin that has been force-pushed away or a
      # directory upstream moved. `sync.sh` fails on a missing subtree.
      - run: tools/upstream/sync.sh --integrations
      - name: The crates the manifest promises
        run: |
          set -eu
          test -d upstream/react/compiler/crates/react_compiler_validation
          test -d upstream/relay/compiler/crates/graphql-ir
          test -d upstream/react-native/packages/react-native-codegen
          test -d upstream/react-native/packages/react-native/Libraries
          echo "upstream integrations: every promised subtree is present"

  # Deleted in #49 and still required by the repository ruleset, so every pull
  # request was blocked on a context nothing reported. See #197.
  #
  # It is restored rather than dropped because `--all-features` is coverage
  # nothing else has: `uf_check`'s `upstream-typecheck` is on by default, but
  # any other optional feature in the workspace is compiled only here.
  upstream-typecheck:
    name: Upstream Flow Typecheck
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    env:
      # Flow's typing crates declare `#![feature(box_patterns)]`, which the
      # compiler removed around 2026-09-01. This date is the newest nightly
      # that still accepts it, so the pin is not a preference — a floating
      # `nightly` cannot build the type checker at all. `RUSTUP_TOOLCHAIN`
      # because `rust-toolchain.toml` overrides `rustup default`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The suite builds the docs site through the real `@uniflowed/vite`, and
      # those tests fail rather than skip when the workspace is not installed.
      # Same reason the `Test` job installs, and the reason this job failed the
      # first time it came back.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # `uf build --compile` embeds the build in a Bun runtime, and the two
      # tests that exercise it fail rather than skip when Bun is absent: a
      # single-file build nobody runs is a single-file build nobody has.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun --version
      # And Deno, for `crates/uf_cli/tests/deno_host.rs`, for the reason the
      # `Test` job installs it. This job runs the same suite, so a runtime
      # missing here is a suite that fails here — which is the policy working:
      # those tests fail rather than skip, so that a host claim nobody checked
      # cannot be green.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v1.x
      - run: deno --version
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  upstream-flow:
    name: Upstream Flow
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    env:
      # `rust-toolchain.toml` pins the release nightly and overrides
      # `rustup default`, so the moving channel only takes effect through this.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      # Early warning that the Flow port still builds on the moving channel, so
      # the pin in `rust-toolchain.toml` can be advanced deliberately rather
      # than discovered when it breaks. Only the parser: the typing crates need
      # `box_patterns`, which the current nightly no longer has, which is
      # exactly what this job is here to tell us about.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run flow:clippy
      - run: ./target/release/uf run flow:test


  # One check that is true only when every other one is.
  #
  # Every job above declares `needs: toolchain`, and a job whose dependency
  # fails is not run — it reports `skipped`. GitHub counts a skipped required
  # check as satisfied, so a `Toolchain` that fails turns `Format`, `Clippy`,
  # `Test`, `Bench Compile` and `Metadata` — the whole required set — into
  # passes, and an armed auto-merge fires.
  #
  # That is not hypothetical. `main` was left not compiling on 2026-09-06:
  # `Toolchain` on #343 failed with the exact `E0004` the merge went on to
  # introduce, at 08:03:24, and the pull request merged at 08:04:00. See #367.
  #
  # This job runs whatever happened above it (`if: always()`) and is red unless
  # every job it names is green. `skipped` is a failure here, deliberately:
  # a check that did not run has not passed, and that is the whole bug.
  #
  # `Upstream Flow` is not in the list, and that is not an oversight:
  # `ci-gate excludes upstream-flow` — it builds the parser on the *moving*
  # nightly on purpose, to say early when the pin will have to move, so it is
  # expected to go red and must not block a merge. Everything else is here,
  # including the jobs that were never in the required set: a job worth running
  # is a job worth failing on.
  #
  # That sentence is the marker as well as the argument:
  # `tools/ci/gate-covers-every-job.sh` reads this file and fails on a job that
  # is in neither the list below nor a `ci-gate excludes <job>` line, because a
  # list somebody has to add to is a list somebody forgets — which is how
  # `Flow lint` spent a day being a check no merge had to pass. The `Metadata`
  # job runs it, and `uf run ci:gate` is it on a laptop.
  ci:
    name: CI
    if: always()
    needs:
      - toolchain
      - format
      - clippy
      - test
      - flow-format
      - flow-lint
      - docs
      - library
      - installer
      - bench-compile
      - metadata
      - upstream-integrations
      - upstream-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Every job it depends on succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          echo "$RESULTS"
          # `jq` over the results rather than `contains(needs.*.result, …)`,
          # so the message names the jobs rather than only saying that one of
          # them was not green.
          failed=$(printf '%s' "$RESULTS" | jq -r 'to_entries | map(select(.value.result != "success")) | .[] | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "these jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "every job succeeded"
