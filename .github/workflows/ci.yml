name: CI

# Check both the pull request and the merge queue result.
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

# Every job here reads the repository and writes nothing to it. Saying so at
# the top rather than per job means a job added later inherits the narrow
# token instead of the default one.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UF_CI_PREBUILT: "1"
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  CARGO_BUILD_FINGERPRINT: content

jobs:
  changes:
    name: Changed files
    runs-on: blacksmith-32vcpu-ubuntu-2404
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node tools/ci/change-scope.cjs

  toolchain:
    name: Toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: ./.github/actions/rust-cache
        with:
          key: toolchain
      # Built once and shared, because every job below runs its checks through
      # `uf run` — this repository is a uf project, and its pipeline uses the
      # toolchain it ships rather than a second description of the same checks.
      - run: cargo build --profile ci-opt --bin uf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uf-ci
          path: target/ci-opt/uf
          retention-days: 1

  format:
    name: Format
    needs: [changes, toolchain]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: nightly-2026-08-01
          components: rustfmt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.full == 'true'
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
        if: needs.changes.outputs.full == 'true'
      - run: ./target/release/uf run rust:fmt:check
        if: needs.changes.outputs.full == 'true'

  clippy:
    name: Clippy
    needs: [changes, toolchain]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: nightly-2026-08-01
          components: clippy
      - uses: ./.github/actions/rust-cache
        if: needs.changes.outputs.full == 'true'
        with:
          key: clippy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.full == 'true'
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
        if: needs.changes.outputs.full == 'true'
      - run: ./target/release/uf run rust:clippy
        if: needs.changes.outputs.full == 'true'

  test:
    name: Test
    needs: [changes, toolchain]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
        if: needs.changes.outputs.full == 'true'
      # The React Compiler's own fixtures, at the commit `react_compiler` was
      # published from. `rust:test` runs uf's compile path over them and fails
      # when any fixture's result differs from
      # `crates/uf_transform/tests/react_compiler_conformance/baseline.tsv`.
      - run: tools/react-compiler/sync.sh
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: nightly-2026-08-01
      - uses: ./.github/actions/rust-cache
        if: needs.changes.outputs.full == 'true'
        with:
          key: test
      # `uf dev` and `uf build` run Vite on a JavaScript host, and the end-to-end
      # tests build the docs site through it, so the workspace's npm packages
      # are installed the way a project's would be.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.full == 'true'
        with:
          node-version: 24
      - name: Mount npm cache
        if: needs.changes.outputs.full == 'true'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-npm-${{ runner.os }}-node-24
          path: ~/.npm
          commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: needs.changes.outputs.full == 'true'
      # `uf build --compile` embeds the build in a Bun runtime, and the two
      # tests that exercise it fail rather than skip when Bun is absent: a
      # single-file build nobody runs is a single-file build nobody has.
      # Pinned rather than `latest`. `latest` is a different runtime on
      # different days, and a suite that only ever meets the newest Bun cannot
      # see a defect that needs an older one: the Bun adapter shipped output no
      # Bun before 1.3.14 could parse, and all three jobs that install Bun
      # installed `latest`, so CI never ran it on a Bun a deployment might
      # actually have. The `bun-adapter` job below runs the declared minimum
      # and the newest on purpose. See ubugeeei-prod/uf#1048.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.full == 'true'
        with:
          bun-version: 1.3.14
      - run: bun --version
        if: needs.changes.outputs.full == 'true'
      # pnpm 10, pnpm 12, Yarn 1 and Yarn 4, for `crates/uf_cli/tests/managers.rs`,
      # which runs `uf add`, `uf remove`, `uf dedupe` and `uf link` against each
      # of them — and npm and the Bun above — the way `dependencies.rs` runs npm.
      # Those tests fail rather than skip without them, for the reason the Bun
      # and Deno ones do: a row of the package-manager table nobody ran is a row
      # nobody knows is right. The releases are pinned in the script, and
      # `tools/ci/workspace-suite-runtimes.sh` holds every suite job to it.
      - run: tools/ci/install-package-managers.sh "$RUNNER_TEMP/uf-package-managers"
        if: needs.changes.outputs.full == 'true'
      # Deno runs uf projects through `@uniflowed/host/deno-preload`, which is
      # built on `node:module`'s `registerHooks` — a hook Deno implemented in
      # 2.8 — and `crates/uf_cli/tests/deno_host.rs` is what keeps
      # `uf_runtime::HOSTS`'s Deno row honest: it starts the binary, loads Flow
      # through the preload, runs `uf test` on it, and checks that the
      # permission set uf translates is one Deno actually enforces. Those tests
      # fail rather than skip when Deno is absent or older than the hook, for
      # the reason the Bun ones do.
      # `v2.x`, the line that has the hook. It was `v1.x` while one test
      # measured an absence particular to that line — no global `process` — and
      # uf no longer starts a Deno that old.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: needs.changes.outputs.full == 'true'
        with:
          deno-version: v2.x
      - run: deno --version
        if: needs.changes.outputs.full == 'true'
      # Blacksmith's image carries Chromium, but the distro binary can spend
      # browser-mode's start budget talking to a broken DBus session before it
      # opens the test page. Use the same wrapper the publish job uses so the
      # browser integration test is still real, just started with CI's sandbox
      # constraints named explicitly.
      - run: tools/ci/browser-wrapper.sh
        if: needs.changes.outputs.full == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.full == 'true'
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
        if: needs.changes.outputs.full == 'true'
      # A crash in the suite leaves a core, kept with the binary that wrote it.
      # `uf_fmt`'s `guarantees` died of SIGSEGV twice on 2026-09-14 with nothing
      # but the signal in the log, and 560 runs looking for it found nothing:
      # the crash that can be read is the one that happens. See #1071.
      - run: tools/ci/test-cores.sh run ./target/release/uf run rust:test
        if: needs.changes.outputs.full == 'true'
      - if: needs.changes.outputs.full == 'true' && failure()
        run: tools/ci/test-cores.sh collect
      - if: needs.changes.outputs.full == 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-cores-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-cores-packed
          if-no-files-found: ignore
          retention-days: 3

  flow-format:
    name: Flow format
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-01
      # `uf fmt` hands the JSON and CSS to the non-Flow formatter, which is a
      # dependency rather than a global install — so the dependencies have to be
      # here even though nothing in this job runs JavaScript.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Mount npm cache
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-npm-${{ runner.os }}-node-24
          path: ~/.npm
          commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      # `rust:fmt:check` is cargo's half. This is uf's: the formatter this
      # repository ships, over the Flow this repository is written in. It is
      # the only thing that checks the shipped packages' formatting at all.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run fmt:check

  flow-lint:
    name: Flow lint
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-01
      # `uf lint` reads `uf.config.js`, which imports `@uniflowed/config`, so
      # the dependencies have to be installed even though the linter does not
      # run a line of JavaScript.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Mount npm cache
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-npm-${{ runner.os }}-node-24
          path: ~/.npm
          commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      # uf is the only thing that can lint uf's own packages, so until this job
      # existed a regression in the linter was invisible to every other check
      # in the pipeline — including to the linter's own Rust tests, which
      # exercise it against fixtures rather than against 322 real files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      - run: ./target/release/uf run check:lib

  docs:
    name: Docs build
    needs: toolchain
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Mount npm cache
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-npm-${{ runner.os }}-node-24
          path: ~/.npm
          commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The documentation site is a uf project in this repository, built by
      # `uf build#docs`. The Docs workflow builds it too, on its own trigger;
      # this job is what makes a pull request that breaks the site fail before
      # it is merged rather than after.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
      # The hydration check opens the built site in Chromium. Use the same
      # wrapper as the browser tests so CI's sandbox constraints are named in
      # one place.
      - run: tools/ci/browser-wrapper.sh
      # `docs:verify` rather than `docs:build`: it builds the site and then
      # runs the checks over that one build, in one task graph, because
      # `uf run` takes one task and `docs:build` is always run.
      #
      # `docs:links` is the reason this is not `docs:build` any more. A page
      # that moves takes every link to its old name with it, and each page
      # prerenders on its own, so a dead `<a href>` renders perfectly and
      # 404s when a reader clicks it. Anchors are checked against the ids the
      # markdown pipeline rendered and `sitemap.xml` against the documents
      # that were prerendered — both of which exist only in the output.
      # Offline, so it cannot fail on somebody else's host;
      # `docs:links:external` is the network half and runs on a schedule.
      # See #527.
      #
      # `security:scan` is here rather than in `Metadata` for the same
      # reason: two of its three passes read what `uf build` wrote and what
      # `uf new` writes, and neither exists in a job that does not build. It
      # audits `docs/security.md` against the repository — a row that names a
      # test names one that exists — scans the published output for
      # credential files, well-known token shapes and the build machine's own
      # path, and audits a freshly scaffolded project. See #524.
      - run: ./target/release/uf run docs:verify

  library:
    name: Library
    needs: [changes, toolchain]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.full == 'true'
        with:
          node-version: 24
      - name: Mount npm cache
        if: needs.changes.outputs.full == 'true'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-npm-${{ runner.os }}-node-24
          path: ~/.npm
          commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: needs.changes.outputs.full == 'true'
      # The `@uniflowed/*` packages are Flow, so `cargo test` cannot run a line
      # of them — their tests are uf tests, run by the runner this repository
      # ships. Without this job the library has a suite nothing executes.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.full == 'true'
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
        if: needs.changes.outputs.full == 'true'
      - run: ./target/release/uf run test:lib
        if: needs.changes.outputs.full == 'true'
      - run: ./target/release/uf run edge:smoke
        if: needs.changes.outputs.full == 'true'
      - run: ./target/release/uf run instrumentation:smoke
        if: needs.changes.outputs.full == 'true'
      - run: ./target/release/uf run migration:smoke
        if: needs.changes.outputs.full == 'true'

  # The same suite on Node 26, which ships a native `Temporal`.
  # `@uniflowed/core/temporal` defers to a host's Temporal and supplies Lite
  # where there is none, and Node 24 has none — so under `Library` every
  # package runs on Lite, and nothing that differs between Lite and the real
  # thing can fail there. Two things did: the export lost every constructor on
  # a native host (#1008), and Lite printed and accepted what Temporal does not
  # (#1052). Both were green in this pipeline until this job existed.
  library-node-26:
    name: Library (Node 26)
    needs: [changes, toolchain]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.full == 'true'
        with:
          node-version: 26
      - name: Mount npm cache
        if: needs.changes.outputs.full == 'true'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-npm-${{ runner.os }}-node-26
          path: ~/.npm
          commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: needs.changes.outputs.full == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.full == 'true'
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
        if: needs.changes.outputs.full == 'true'
      - run: ./target/release/uf run test:lib
        if: needs.changes.outputs.full == 'true'

  library-deno:
    name: Library (Deno 2.9.7)
    needs: [changes, toolchain]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.full == 'true'
        with:
          node-version: 24
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: needs.changes.outputs.full == 'true'
        with:
          deno-version: v2.9.7
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: needs.changes.outputs.full == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.full == 'true'
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
        if: needs.changes.outputs.full == 'true'
      # Reuse the toolchain artifact; the local task builds it as a dependency.
      - run: UF_BINARY=./target/release/uf node tools/ci/deno-library.js
        if: needs.changes.outputs.full == 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.full == 'true' && always()
        with:
          name: deno-library
          path: .uf/deno-library
          retention-days: 3

  installer:
    name: Installer
    needs: [changes, toolchain]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@a6f249f8370a56aa9dc4adfee19b3127d0f7f9ec # v1.8.0
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.full == 'true'
        with:
          node-version: 24
      # Packages a release and installs it with the real installer. Keeps
      # install.sh and package-binaries.sh from drifting apart between releases,
      # when the only thing that notices is a user running `curl … | sh`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.full == 'true'
        with:
          name: uf-ci
          path: target/release
      - run: chmod +x target/release/uf
        if: needs.changes.outputs.full == 'true'
      - run: ./target/release/uf run install:test
        if: needs.changes.outputs.full == 'true'

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.full == 'true'
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
        if: needs.changes.outputs.full == 'true'
        shell: bash
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: nightly-2026-08-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.changes.outputs.full == 'true'
        with:
          key: windows-native
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.full == 'true'
        with:
          node-version: 24
      - name: Resolve Windows versions across content types
        if: needs.changes.outputs.full == 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/release/test-install-version.ps1
      # Exercise installation without paying for three optimized LTO links.
      # release.yml verifies the optimized archives on the same host.
      - name: Package the Windows CI binaries
        if: needs.changes.outputs.full == 'true'
        shell: bash
        env:
          UF_CARGO_PROFILE: ci
          UF_CARGO_TARGET: "0"
        run: tools/release/package-binaries.sh
      - name: Verify Windows install and self-update
        if: needs.changes.outputs.full == 'true'
        shell: pwsh
        run: |
          $version = & node -p "require('./packages/core/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:UF_TEST_RELEASE_DIR = Join-Path $PWD "dist/release/uf/$version"
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/release/test-install.ps1
      - name: Scaffold, install, and check a Windows project
        if: needs.changes.outputs.full == 'true'
        shell: pwsh
        run: |
          function Run-Uf {
            & $uf @args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $uf = Join-Path $PWD "target/ci/uf.exe"
          $app = Join-Path $env:RUNNER_TEMP "uf-windows-app"
          Run-Uf new $app --name windows-smoke
          & node tools/ci/workspace-fixture.js $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Copy local packages into node_modules, as npm publication does.
          $env:npm_config_install_links = "true"
          Run-Uf --cwd $app install
          $hostPackage = Join-Path $PWD "packages/host"
          $resolveHost = @'
          const { createRequire } = require("node:module");
          const path = require("node:path");
          const app = process.argv[1];
          const host = path.resolve(process.argv[2]);
          const resolved = createRequire(path.join(app, "package.json")).resolve("@uniflowed/host/transform");
          const fs = require("node:fs");
          const actual = path.resolve(resolved);
          const expected = path.join(host, "transform.js");
          if (!fs.readFileSync(actual).equals(fs.readFileSync(expected))) {
            console.error(`installed host does not match the checkout: ${actual}`);
            process.exit(1);
          }
          console.log(`@uniflowed/host -> ${actual}`);
          '@
          & node -e $resolveHost $app $hostPackage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Run-Uf --cwd $app fmt --check
          Run-Uf --cwd $app lint
          Run-Uf --cwd $app check
          Run-Uf --cwd $app test
          Run-Uf --cwd $app build

