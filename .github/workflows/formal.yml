name: Formal

on:
  pull_request:
    paths:
      - "crates/**"
      - "tools/formal/**"
      - ".github/workflows/formal.yml"
      # This job's `why3` and `z3` come from the repository's flake, so a
      # change to the flake can take this job's tools away.
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  why3:
    name: Why3 Z3
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # why3 only knows about provers listed in ~/.why3.conf, which does not
      # exist on a fresh runner, so z3 has to be detected before proving.
      - run: nix develop . --command why3 config detect
      - run: nix develop . --command why3 prove tools/formal/std_contract.mlw -P z3 -a split_vc
