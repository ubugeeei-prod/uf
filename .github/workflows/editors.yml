name: Editors
run-name: ${{ inputs.version && format('Editors {0}', inputs.version) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
    paths:
      - ".github/workflows/editors.yml"
      - "editors/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/editors.yml"
      - "editors/**"
    tags:
      - "uf@*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the uf@ prefix"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: editors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vscode:
    name: VS Code
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('uf@{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve extension version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          release=true
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "${REF_NAME#uf@}" != "$REF_NAME" ]; then
            version="${REF_NAME#uf@}"
          else
            version="$(node -p 'require("./editors/vscode/package.json").version')"
            release=false
          fi
          # The Marketplace takes no semver prerelease, so uf's version is
          # mapped onto one it does take. editors/vscode/release/version.js
          # says how, and fails on a version it cannot place.
          node editors/vscode/release/version.js "$version" > "$RUNNER_TEMP/published"
          cat "$RUNNER_TEMP/published"
          marketplace_version="$(sed -n 's/^marketplace_version=//p' "$RUNNER_TEMP/published")"
          pre_release="$(sed -n 's/^pre_release=//p' "$RUNNER_TEMP/published")"
          # Only a release is stamped. Any other run's VSIX keeps
          # package.json's 0.0.0, which every published version replaces.
          if [ "$release" = true ]; then
            node -e 'const fs=require("node:fs"); const file="editors/vscode/package.json"; const p=JSON.parse(fs.readFileSync(file,"utf8")); p.version=process.argv[1]; fs.writeFileSync(file, JSON.stringify(p, null, 2)+"\n")' "$marketplace_version"
          else
            pre_release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pre_release=$pre_release" >> "$GITHUB_OUTPUT"
      - name: Package VSIX
        working-directory: editors/vscode
        env:
          PRE_RELEASE: ${{ steps.version.outputs.pre_release }}
        run: |
          set -eu
          # The Marketplace page links the licence from the package.
          cp ../../LICENSE LICENSE
          npm ci --no-audit --no-fund
          flags=""
          if [ "$PRE_RELEASE" = "true" ]; then
            flags="--pre-release"
          fi
          ./node_modules/.bin/vsce package $flags --out "../../uf-vscode-${{ steps.version.outputs.version }}.vsix"
      - name: Verify packaged grammar with VS Code's TextMate engine
        run: |
          node -e 'const {downloadAndUnzipVSCode}=require("./editors/vscode/node_modules/@vscode/test-electron"); const path=require("node:path"); downloadAndUnzipVSCode({version:"stable"}).then(executable => require("./editors/vscode/test/syntax.cjs").verifySyntax(path.resolve(executable,"..","resources","app"))).catch(error => { console.error(error); process.exitCode=1; });'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uf-vscode-${{ steps.version.outputs.version }}
          path: uf-vscode-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error
      # A step without its token says so by name and succeeds, so a release
      # made before the owner has created the tokens is not red for it.
      # `--skip-duplicate` makes a rerun of a partly published release, or a
      # tag push arriving beside the dispatch, a no-op rather than a failure.
      - name: Publish to Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/uf@') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -eu
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT is not set; skipping Visual Studio Marketplace publish"
            exit 0
          fi
          editors/vscode/node_modules/.bin/vsce publish --skip-duplicate --packagePath "uf-vscode-${{ steps.version.outputs.version }}.vsix" --pat "$VSCE_PAT"
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/uf@') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -eu
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice::OVSX_PAT is not set; skipping Open VSX publish"
            exit 0
          fi
          editors/vscode/node_modules/.bin/ovsx publish "uf-vscode-${{ steps.version.outputs.version }}.vsix" --skip-duplicate -p "$OVSX_PAT"

  # `uf editor install vscode` downloads the .vsix from the GitHub release of
  # the uf running it, and refuses one whose digest does not match the
  # .sha256 beside it. So a release run attaches both. The release itself is
  # created by release.yml; this job adds to it and never creates one, because
  # a release with only an extension on it would be a uf version with no uf.
  release-assets:
    name: Attach the VS Code extension to the release
    needs: vscode
    if: startsWith(github.ref, 'refs/tags/uf@') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload assets to the existing release.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-vscode-${{ needs.vscode.outputs.version }}
          path: assets
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.vscode.outputs.version }}
        run: |
          set -eu
          tag="uf@${VERSION}"
          vsix="uf-vscode-${VERSION}.vsix"
          cd assets
          test -f "$vsix"
          sha256sum "$vsix" > "${vsix}.sha256"
          cat "${vsix}.sha256"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag does not exist yet; run release.yml first, then this workflow with version ${VERSION}"
            exit 1
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$vsix" "${vsix}.sha256"

  zed:
    name: Zed
    runs-on: ubuntu-latest
    env:
      # Zed's own `zed-extension`, the tool zed-industries/extensions runs to
      # package every extension in the registry: it loads extension.toml the
      # way Zed does, compiles the crate the way Zed does (`cargo build
      # --release --target wasm32-wasip2`), reads the extension API version out
      # of the component, and writes the manifest.json and archive the
      # registry would publish. Pinned to the commit that repository's CI
      # uses, and to the digest of that build.
      ZED_EXTENSION_CLI_SHA: 9ee3c503a4bbbc6b4a0f8a789acca4871d773223
      ZED_EXTENSION_CLI_SHA256: a6fca5ef11ff23f0ef8b03bd2453270591c9fc6c03700c3c92017e5082ada757
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('uf@{0}', inputs.version) || github.ref }}
      # Zed compiles extensions for wasm32-wasip2, the component-model target.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-01
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: editors/zed
          key: zed-extension
      # editors/zed is its own workspace, so the workspace's fmt and clippy
      # runs never see it.
      - run: cargo fmt --manifest-path editors/zed/Cargo.toml -- --check
      # The decisions (which binary, which arguments, which environment) are
      # plain functions, tested on the host.
      - run: cargo test --manifest-path editors/zed/Cargo.toml --locked
      - run: cargo clippy --manifest-path editors/zed/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo clippy --manifest-path editors/zed/Cargo.toml --locked --target wasm32-wasip2 -- -D warnings
      - name: Package with zed-extension
        run: |
          set -eu
          cli="$RUNNER_TEMP/zed-extension"
          curl -fsSL --retry 3 -o "$cli" \
            "https://zed-extension-cli.nyc3.digitaloceanspaces.com/${ZED_EXTENSION_CLI_SHA}/x86_64-unknown-linux-gnu/zed-extension"
          echo "${ZED_EXTENSION_CLI_SHA256}  $cli" | sha256sum -c -
          chmod +x "$cli"
          mkdir -p "$RUNNER_TEMP/zed-output"
          RUST_LOG=info "$cli" \
            --source-dir editors/zed \
            --scratch-dir "$RUNNER_TEMP/zed-scratch" \
            --output-dir "$RUNNER_TEMP/zed-output"
          manifest="$RUNNER_TEMP/zed-output/manifest.json"
          cat "$manifest"
          # What the registry would list: a language server and nothing else,
          # built against the API version Cargo.lock pins.
          api="$(sed -n '/^name = "zed_extension_api"$/{n;s/^version = "\(.*\)"$/\1/p;}' editors/zed/Cargo.lock)"
          test -n "$api"
          jq -e --arg api "$api" '
            .name == "uf"
            and .provides == ["language-servers"]
            and .wasm_api_version == $api
            and .schema_version == 1
          ' "$manifest"
          test -s "$RUNNER_TEMP/zed-output/archive.tar.gz"
          tar -tzf "$RUNNER_TEMP/zed-output/archive.tar.gz" | grep -qx './extension.wasm'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uf-zed-extension
          path: |
            ${{ runner.temp }}/zed-output/manifest.json
            ${{ runner.temp }}/zed-output/archive.tar.gz
          if-no-files-found: error

  # The configuration-only integrations, run in the editors themselves. Each
  # test starts `editors/test/fake-lsp.cjs` in place of `uf lsp` (and of a
  # TypeScript server): what is checked is what the configuration decides —
  # which buffers get uf, in which directory, and that the TypeScript server
  # stays off a uf project and on everywhere else — not uf's answers, which
  # `tests/library/lsp.test.js` checks against the real server.
  neovim:
    name: Neovim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q neovim
      - run: nvim --version | head -1
      - run: nvim --headless -n -u NONE -i NONE -c "luafile editors/neovim/test/run.lua"

  emacs:
    name: Emacs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q emacs-nox
      - run: emacs --version | head -1
      # Warnings are errors: a free variable or an undefined function in a
      # file people `require` is a bug that only shows at the wrong moment.
      - run: emacs --batch -L editors/emacs --eval "(setq byte-compile-error-on-warn t)" -f batch-byte-compile editors/emacs/uf.el
      - run: emacs --batch -L editors/emacs -l ert -l editors/emacs/test/uf-tests.el -f ert-run-tests-batch-and-exit
      - run: rm -f editors/emacs/uf.elc
