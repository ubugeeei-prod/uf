name: Semver

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-semver-checks:
    name: Cargo Semver Checks
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - id: exclude
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          echo "crates=$(tools/ci/semver-exclude.sh "$BASELINE")" >> "$GITHUB_OUTPUT"
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          rust-toolchain: "nightly-2026-08-01"
          # Two kinds of crate cannot be compared, and tools/ci/semver-exclude.sh
          # explains both: the ones whose baseline copy loses the relative path
          # to the `upstream/flow` submodule, and the ones that did not exist at
          # the baseline yet. The second half is computed there rather than
          # written down here, because a crate excluded by hand stays excluded
          # long after it has a baseline — `uf_jsx` was missed that way.
          exclude: ${{ steps.exclude.outputs.crates }}
