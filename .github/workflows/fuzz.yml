name: Fuzz

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tools/fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-build:
    name: Fuzz Build
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo +nightly install cargo-fuzz --locked
      # `cargo fuzz` looks for `<cargo project root>/fuzz` unless told otherwise,
      # and this repository keeps its fuzz crate at `tools/fuzz`.
      - run: cargo +nightly fuzz build config_object --fuzz-dir tools/fuzz
      - run: cargo +nightly fuzz build dts_translate --fuzz-dir tools/fuzz
