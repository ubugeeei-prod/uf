name: Fuzz

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tools/fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-build:
    name: Fuzz Build
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo +nightly install cargo-fuzz --locked
      # `cargo fuzz` looks for `<cargo project root>/fuzz` unless told otherwise,
      # and this repository keeps its fuzz crate at `tools/fuzz`.
      - run: cargo +nightly fuzz build config_object --fuzz-dir tools/fuzz
      - run: cargo +nightly fuzz build dts_translate --fuzz-dir tools/fuzz
