name: Release artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  wasm:
    name: Build sqlc WASM plugin
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-01
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: sqlc-wasm
      - run: |
          cargo build -p uf_sqlc --bin sqlc-gen-flow --target wasm32-wasip1 --profile dist
          mkdir -p artifacts
          cp target/wasm32-wasip1/dist/sqlc-gen-flow.wasm artifacts/
          (cd artifacts && sha256sum sqlc-gen-flow.wasm > sqlc-gen-flow.wasm.sha256)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cd tests/sqlc && npm ci --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-ci
          path: target/release
      - run: |
          chmod +x target/release/uf
          sh tools/ci/sqlc-wasm.sh "$PWD/artifacts/sqlc-gen-flow.wasm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uf-release-sqlc-wasm
          path: artifacts
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.builder }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            builder: blacksmith-32vcpu-ubuntu-2404
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            builder: blacksmith-32vcpu-ubuntu-2404-arm
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            builder: blacksmith-12vcpu-macos-15
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            builder: blacksmith-12vcpu-macos-15
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            builder: blacksmith-32vcpu-windows-2025
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow long upstream paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-01
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Limit Windows release codegen memory
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          echo CARGO_PROFILE_DIST_LTO=off >> "$GITHUB_ENV"
          echo CARGO_BUILD_JOBS=1 >> "$GITHUB_ENV"

      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          workspace="$(cargo metadata --no-deps --format-version 1 \
            | node -e 'const m=JSON.parse(require("node:fs").readFileSync(0,"utf8"));
                       const p=m.packages.find(x=>x.name==="uf_cli");
                       process.stdout.write(p.version)')"
          if [ "$version" != "$workspace" ]; then
            echo "tag says ${version}, but uf_cli is ${workspace}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          UF_TARGET: ${{ matrix.target }}
          UF_VERSION: ${{ steps.version.outputs.version }}
          UF_CARGO_PROFILE: dist
        run: tools/release/package-binaries.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uf-release-${{ matrix.target }}
          path: dist/release/uf/${{ steps.version.outputs.version }}
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version="${INPUT_VERSION:-${REF_NAME#uf@}}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uf-release-${{ matrix.target }}
          path: dist/release/uf/${{ steps.version.outputs.version }}
      - name: Verify the installer against this archive
        if: runner.os != 'Windows'
        env:
          UF_TEST_RELEASE_DIR: dist/release/uf/${{ steps.version.outputs.version }}
        run: tools/release/test-install.sh
      - name: Verify the PowerShell installer against this archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UF_TEST_RELEASE_DIR: dist/release/uf/${{ steps.version.outputs.version }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/release/test-install.ps1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Install native platform dependencies from this archive
        env:
          UF_TEST_RELEASE_DIR: dist/release/uf/${{ steps.version.outputs.version }}
          UF_TEST_TARGET: ${{ matrix.target }}
        run: node tools/ci/native-pm-platform.cjs "$UF_TEST_RELEASE_DIR/uf-$UF_TEST_TARGET.tar.gz"
