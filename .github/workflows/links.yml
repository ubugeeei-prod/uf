# The manual's external links, resolved over the network.
#
# `CI` runs `docs:links`, which reads the built site and touches nothing: an
# internal link, an anchor and an asset are all decided by looking in the
# output directory, so that check has one answer for a given `dist/` and is
# safe to block a pull request on.
#
# This is the other half, and it is on a schedule for a reason that is about
# people rather than about the network. An external host that is slow, rate
# limiting, or down for ten minutes would fail a pull request that changed
# nothing — and a check that fails for a reason the author cannot act on is a
# check people learn to re-run until it goes green. That habit is what makes
# the *real* failure invisible, so this never blocks a merge. It runs nightly,
# and it is `uf run docs:links:external` on a laptop.
#
# Even here, only a definite answer counts: `404`, `410` and `451` are dead,
# and a timeout, a `429` or a `5xx` is reported as unverified and passes,
# because none of those is a statement about the link.
name: Links

on:
  schedule:
    # 04:17 UTC. A minute nobody else picked, because every workflow scheduled
    # on the hour queues behind every other one on GitHub's shared runners.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external:
    name: External links
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Mount npm cache
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-npm-${{ runner.os }}-node-24
          path: ~/.npm
          commit: ${{ github.ref == 'refs/heads/main' && 'on-change' || 'false' }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The site has to be built before its links can be resolved, and the
      # links this pass is about are the ones in the markup rather than the
      # ones in the sources — a link the layout computes is in no `.mdx` file.
      - run: cargo build --release --bin uf
      - run: ./target/release/uf run docs:links:external
        env:
          UF_BIN: ./target/release/uf
