# npm only. Native binaries are built, verified, and released by
# `release.yml`, which runs on the same `uf@*` tags.
name: Publish

on:
  push:
    tags:
      - "uf@*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Trusted npm Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      # The suite drives the docs site through the real `@uniflowed/vite`, and
      # those tests now fail rather than skip when the workspace is not
      # installed. Without this the publish job failed on a missing fixture
      # while the packages it was about to publish were fine.
      - run: npm ci --no-audit --no-fund
      - run: cargo test --workspace
      # Only the packages in `tools/release/published-packages.txt`, which is
      # the set that is implemented. Publishing a declaration module whose
      # functions throw would squat the name and would need a trusted-publisher
      # configuration of its own, which is a manual step on npmjs.com.
      #
      # Every one of these is bound to this workflow by `npm trust`, so this
      # job is the only thing that can publish them and it authenticates with
      # the OIDC id-token GitHub mints for it. There is no npm token in this
      # repository, in its secrets, or on anyone's machine.
      # See tools/release/trust-npm.sh.
      - name: Publish
        run: |
          set -eu
          publish() {
            directory="packages/$1"
            name="$(node -p "require('./${directory}/package.json').name")"
            version="$(node -p "require('./${directory}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${version} is already published"
              return 0
            fi
            tag=latest
            case "$version" in
              *-alpha*) tag=alpha ;;
              *-beta*) tag=beta ;;
              *-rc*) tag=rc ;;
            esac
            ( cd "$directory" && npm publish --access public --tag "$tag" )
          }

          for package in $(grep -vE '^\s*(#|$)' tools/release/published-packages.txt); do
            publish "$package"
          done
