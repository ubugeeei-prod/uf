name: Publish
run-name: Publish ${{ inputs.version }} (${{ inputs.commit }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from the merged release PR
        required: true
        type: string
      commit:
        description: Exact merged commit
        required: true
        type: string
      validation_run:
        description: Successful merge-queue CI run containing the tested archives
        required: true
        type: string

permissions:
  contents: read
  actions: read # Verify the exact successful merge-queue run.

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  authorize:
    name: Authorize npm publication
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: node tools/release/policy.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          VALIDATION_RUN: ${{ inputs.validation_run }}

  npm:
    name: Trusted npm Publish
    needs: authorize
    environment: release
    permissions:
      contents: read
      id-token: write # Authenticate npm trusted publishing.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Refuse missing npm names before publishing
        run: tools/release/publish-names-exist.sh
      - name: Publish
        run: |
          set -eu
          publish() {
            directory="packages/$1"
            name="$(node -p "require('./${directory}/package.json').name")"
            version="$(node -p "require('./${directory}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${version} is already published"
              return 0
            fi
            tag=latest
            case "$version" in
              *-alpha*) tag=alpha ;;
              *-beta*) tag=beta ;;
              *-rc*) tag=rc ;;
            esac
            ( cd "$directory" && npm publish --access public --tag "$tag" )
          }

          for package in $(grep -vE '^\s*(#|$)' tools/release/published-packages.txt); do
            publish "$package"
          done

  verify:
    name: Verify the npm release
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: What actually reached npm
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: tools/release/verify-npm.sh "${VERSION#uf@}"
      - name: The dist-tag move this pipeline cannot make
        run: |
          set -eu
          echo "::notice::While @uniflowed/* has no stable release, publishing on the prerelease tag does not move 'latest'. Run 'uf run release:promote' (tools/release/promote-latest.sh) from an npm session you are logged in to. 'uf run release:preflight' fails on the drift before the next tag."
