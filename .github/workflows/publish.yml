# npm only. Native binaries are built, verified, and released by
# `release.yml`, which runs on the same `uf@*` tags.
name: Publish

on:
  push:
    tags:
      - "uf@*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Trusted npm Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: cargo test --workspace
      # Every package under `packages/` is published, `core` first because the
      # others declare it as a dependency and npm rejects a manifest whose
      # dependency is not yet on the registry.
      - name: Publish
        run: |
          set -eu
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            version="$(node -p "require('./$1/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${version} is already published"
              return 0
            fi
            tag_args=()
            case "$version" in
              *-alpha*) tag_args=(--tag alpha) ;;
              *-beta*) tag_args=(--tag beta) ;;
              *-rc*) tag_args=(--tag rc) ;;
            esac
            ( cd "$1" && npm publish --access public "${tag_args[@]}" )
          }

          publish packages/core
          for manifest in packages/*/package.json; do
            directory="${manifest%/package.json}"
            [ "$directory" = "packages/core" ] && continue
            publish "$directory"
          done
