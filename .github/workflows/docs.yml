name: Docs

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "brand/**"
      - "crates/uf_cli/**"
      - "crates/uf_lib/**"
      - "docs/**"
      - "infra/cloudflare/setup-assets/**"
      - "infra/cloudflare/workers/docs.js"
      - "infra/cloudflare/workers/setup.js"
      - "infra/cloudflare/wrangler.docs.jsonc"
      - "infra/cloudflare/wrangler.setup.jsonc"
      - "tools/docs/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "brand/**"
      - "crates/uf_cli/**"
      - "crates/uf_lib/**"
      - "docs/**"
      - "infra/cloudflare/setup-assets/**"
      - "infra/cloudflare/workers/docs.js"
      - "infra/cloudflare/workers/setup.js"
      - "infra/cloudflare/wrangler.docs.jsonc"
      - "infra/cloudflare/wrangler.setup.jsonc"
      - "tools/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: tools/docs/build.sh
      - run: npx --yes wrangler@4.128.0 deploy --dry-run --config infra/cloudflare/wrangler.docs.jsonc
      - run: npx --yes wrangler@4.128.0 deploy --dry-run --config infra/cloudflare/wrangler.setup.jsonc

  deploy:
    name: Deploy docs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/upstream/sync.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-08-01
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install wild-linker --version 0.10.0 --locked
      - run: wild --version
      - run: tools/docs/build.sh
      - run: npx --yes wrangler@4.128.0 deploy --config infra/cloudflare/wrangler.docs.jsonc
      - run: npx --yes wrangler@4.128.0 deploy --config infra/cloudflare/wrangler.setup.jsonc
