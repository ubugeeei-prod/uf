[package]
name = "uf_test"
description = "Native test discovery, scheduling and runner core for uniflowed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
uf_infra = { path = "../uf_infra" }
uf_rsc = { path = "../uf_rsc" }
camino.workspace = true
compact_str.workspace = true
notify.workspace = true
oxc_sourcemap.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true

# Signalling a worker's whole process group; see `Worker::kill`. Unix only
# because uf is: there is no Windows build, and the shim this is about is a
# Unix `PATH` entry.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
criterion.workspace = true
similar-asserts.workspace = true
tempfile.workspace = true

[[bench]]
name = "test_discovery"
harness = false

[[bench]]
name = "runner"
harness = false
