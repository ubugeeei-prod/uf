[package]
name = "uf_lib"
description = "Native modules exposed to Flow for the Unified Toolchain for Flow (React)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
compact_str.workspace = true
uf_infra = { path = "../uf_infra" }
uf_std = { path = "../uf_std" }
uf_tui = { path = "../uf_tui" }
serde.workspace = true

[dev-dependencies]
camino.workspace = true
# The registry claims to name what each package exports; the only honest way to
# check that is to parse the package. uf ships a Flow parser, so a regular
# expression here would be a second, worse answer to a question the repository
# has already answered.
uf_flow = { path = "../uf_flow" }
serde_json.workspace = true
walkdir.workspace = true
