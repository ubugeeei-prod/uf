[package]
name = "uf_config"
description = "Configuration loading for the Unified Toolchain for Flow (React)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
camino.workspace = true
compact_str.workspace = true
json5.workspace = true
uf_assets = { path = "../uf_assets" }
uf_bundle = { path = "../uf_bundle" }
uf_runtime = { path = "../uf_runtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
similar-asserts.workspace = true
tempfile.workspace = true
# `tests/flow_schema.rs` reads `@uniflowed/config`'s Flow type and compares the
# keys it declares with the ones this crate deserializes. uf ships a Flow
# parser, so a regular expression over the declaration would be a second and
# worse answer to a question the repository has already answered.
uf_flow = { path = "../uf_flow" }

[[bench]]
name = "config"
harness = false
