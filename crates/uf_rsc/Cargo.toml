[package]
name = "uf_rsc"
description = "React Server Components module graph and server action registry for uniflowed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
camino.workspace = true
compact_str.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
thiserror.workspace = true
uf_infra = { path = "../uf_infra" }
# The registry of uf's own packages, for the one fact the graph cannot read out
# of a project: which hooks `@uniflowed/hooks` exports only run in a browser.
# `hook_descriptors()` has carried it since before this crate existed and
# nothing read it. See ubugeeei-prod/uf#388.
uf_lib = { path = "../uf_lib" }
walkdir.workspace = true

[dev-dependencies]
criterion.workspace = true
similar-asserts.workspace = true
tempfile.workspace = true

[[bench]]
name = "rsc"
harness = false
