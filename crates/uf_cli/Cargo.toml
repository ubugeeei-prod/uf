[package]
name = "uf_cli"
description = "Unified Toolchain for Flow (React)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "uf"
path = "src/bin/uf.rs"

[[bin]]
name = "ufr"
path = "src/bin/ufr.rs"

[[bin]]
name = "ufx"
path = "src/bin/ufx.rs"

[features]
default = ["upstream-typecheck"]
# Run Flow's own type inference in `uf check`; see `crates/uf_check`.
upstream-typecheck = ["dep:uf_check", "uf_check/upstream-typecheck"]

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
uf_bundle = { path = "../uf_bundle" }
uf_check = { path = "../uf_check", optional = true }
uf_config = { path = "../uf_config" }
uf_doc = { path = "../uf_doc" }
uf_flow = { path = "../uf_flow" }
uf_fmt = { path = "../uf_fmt" }
uf_infra = { path = "../uf_infra" }
uf_lib = { path = "../uf_lib" }
uf_env = { path = "../uf_env" }
uf_lint = { path = "../uf_lint" }
uf_plugin = { path = "../uf_plugin" }
uf_pm = { path = "../uf_pm" }
uf_prepare = { path = "../uf_prepare" }
uf_project = { path = "../uf_project" }
uf_rm = { path = "../uf_rm" }
uf_router = { path = "../uf_router" }
uf_rsc = { path = "../uf_rsc" }
uf_runtime = { path = "../uf_runtime" }
uf_stylex = { path = "../uf_stylex" }
uf_term = { path = "../uf_term" }
uf_test = { path = "../uf_test" }
uf_transform = { path = "../uf_transform" }
uf_tui = { path = "../uf_tui" }
compact_str.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
similar-asserts.workspace = true
tempfile.workspace = true
