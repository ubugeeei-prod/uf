[package]
name = "uf_cli"
description = "Unified Toolchain for Flow (React)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "uf"
path = "src/bin/uf.rs"

[[bin]]
name = "ufr"
path = "src/bin/ufr.rs"

[[bin]]
name = "ufx"
path = "src/bin/ufx.rs"

[features]
default = ["upstream-typecheck"]
# Run Flow's own type inference in `uf check`; see `crates/uf_check`. A
# dependency that ships TypeScript declarations and no Flow is typed through
# `uf_dts`'s translation of them, which only a check has a use for.
upstream-typecheck = ["dep:uf_check", "dep:uf_dts", "uf_check/upstream-typecheck"]

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
uf_assets = { path = "../uf_assets" }
uf_bundle = { path = "../uf_bundle" }
uf_check = { path = "../uf_check", optional = true }
uf_config = { path = "../uf_config" }
# The TypeScript declarations a library build publishes beside its JavaScript.
# Not optional and not behind `upstream-typecheck`: `uf build` writes them for
# every library, and a library whose `.d.ts` depended on a feature flag would
# publish a different package depending on how uf was compiled.
uf_declare = { path = "../uf_declare" }
uf_doc = { path = "../uf_doc" }
uf_dts = { path = "../uf_dts", optional = true }
uf_flow = { path = "../uf_flow" }
uf_fmt = { path = "../uf_fmt" }
uf_i18n = { path = "../uf_i18n" }
uf_infra = { path = "../uf_infra" }
uf_lib = { path = "../uf_lib" }
uf_env = { path = "../uf_env" }
uf_lint = { path = "../uf_lint" }
uf_plugin = { path = "../uf_plugin" }
uf_pm = { path = "../uf_pm" }
uf_prepare = { path = "../uf_prepare" }
# The spans the linter and the checker already carry, so that `UF_PROFILE=1 uf
# check` can print where a run's time went. Off by a relaxed atomic load when
# nobody asked; see `commands/check.rs`'s `Profile`.
uf_profiler = { path = "../uf_profiler" }
uf_project = { path = "../uf_project" }
walkdir.workspace = true
tempfile.workspace = true
globset.workspace = true
uf_rm = { path = "../uf_rm" }
uf_router = { path = "../uf_router" }
uf_rsc = { path = "../uf_rsc" }
uf_runtime = { path = "../uf_runtime" }
uf_stylex = { path = "../uf_stylex" }
uf_task = { path = "../uf_task" }
uf_term = { path = "../uf_term" }
uf_test = { path = "../uf_test" }
uf_transform = { path = "../uf_transform" }
uf_tui = { path = "../uf_tui" }
uf_ui = { path = "../uf_ui" }
compact_str.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
json5.workspace = true
sha2.workspace = true

[dev-dependencies]
# Also a dependency above. Named again so the integration tests can
# assert against the cache bound by its constant rather than by a
# number copied out of it.
uf_infra = { path = "../uf_infra" }
# The same, for `tests/deno_host.rs`: it runs Deno with the arguments
# `uf_runtime::permissions` produces rather than with arguments the test
# wrote, which is the difference between checking enforcement and
# checking that a `format!` still works.
uf_runtime = { path = "../uf_runtime" }
# `tests/env.rs` publishes a fixture npm package, and the registry document it
# writes carries the tarball's `sha512-` integrity, which is base64.
base64.workspace = true
assert_cmd.workspace = true
image.workspace = true
similar-asserts.workspace = true
