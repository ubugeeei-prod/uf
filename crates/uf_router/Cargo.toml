[package]
name = "uf_router"
description = "File-system router discovery and Flow type generation for uniflowed apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
camino.workspace = true
compact_str.workspace = true
uf_config = { path = "../uf_config" }
uf_fmt = { path = "../uf_fmt" }
thiserror.workspace = true
walkdir.workspace = true

[dev-dependencies]
criterion.workspace = true
similar-asserts.workspace = true
# The generated router types are checked against the formatter uf ships, so a
# project cannot be scaffolded with code `uf fmt --check` rejects.
tempfile.workspace = true

[[bench]]
name = "router"
harness = false
