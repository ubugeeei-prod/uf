[package]
name = "uf_pm"
description = "Native package manager contracts for @uniflowed/pm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
uf_infra = { path = "../uf_infra" }
base64.workspace = true
camino.workspace = true
compact_str.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
thiserror.workspace = true
uf_config = { path = "../uf_config" }
# `uf.lock` holds `uf_env`'s toolchain record beside the resolver's packages.
# The resolver keeps it, votes around it, and waits on the guard every writer of
# the file holds, and all three are `uf_env::lock`'s to define — a second copy of
# the record's shape here would be a second thing to keep in step.
uf_env = { path = "../uf_env" }

[dev-dependencies]
tempfile.workspace = true
