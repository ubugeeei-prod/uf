[package]
name = "uf_dts"
description = "TypeScript declaration files translated into the Flow modules uf check types a dependency against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
compact_str.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
serde.workspace = true
# A package manifest is JSON, and which declaration file TypeScript reads for a
# specifier is decided by what the manifest says; see `package`.
serde_json.workspace = true
smallvec.workspace = true
uf_infra = { path = "../uf_infra" }

[dev-dependencies]
criterion.workspace = true
similar-asserts.workspace = true

[[bench]]
name = "translate"
harness = false
