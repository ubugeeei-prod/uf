[package]
name = "uf_transform"
description = "Flow to JavaScript for uf: the official Flow parser, Flow's own lowering rules, the official React Compiler, and oxc for JSX and code generation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flow_parser.workspace = true
indexmap.workspace = true
oxc_allocator.workspace = true
oxc_codegen.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_sourcemap.workspace = true
oxc_span.workspace = true
oxc_transformer.workspace = true
react_compiler.workspace = true
react_compiler_ast.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uf_flow = { path = "../uf_flow" }
uf_infra = { path = "../uf_infra" }

[dev-dependencies]
criterion.workspace = true
similar-asserts.workspace = true
# For `tests/parse_options.rs` and nothing else. `uf check` is the fourth
# place uf hands source to the Flow parser, and it is the one that drifted
# (ubugeeei-prod/uf#430); a test that pins the parse options has to be able to
# ask it what it read. This crate is where that test lives because it is the
# only one that can see every entry point.
uf_check = { path = "../uf_check" }

# For `examples/alloc_report.rs`: the counting allocator that produced the
# figures in ubugeeei-prod/uf#668, so the next person to touch this pipeline can
# reproduce them rather than take them on trust.
uf_profiler = { path = "../uf_profiler" }

[[bench]]
name = "transform"
harness = false
