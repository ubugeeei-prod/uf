[toolchain]
# Meta's Flow Rust port matches through `Box` with `deref_patterns`, which is
# still unstable. The compiler removed `box_patterns` around 2026-09-01
# (rust-lang/rust#156749); `tools/upstream/patches/flow/0018-deref-patterns.patch`
# is that replacement. This channel is the current nightly. It is not a
# preference for an older compiler: uf parses and type-checks Flow with the
# official port, and no stable toolchain can build it. See `docs/architecture.md`.
channel = "nightly-2026-10-07"
components = ["clippy", "rustfmt"]
profile = "minimal"
