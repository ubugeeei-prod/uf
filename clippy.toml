disallowed-macros = [
  { path = "std::format", reason = "Append directly with uf_infra::append! or push_str; use uf_infra::cstr! for an owned CompactString" },
]

disallowed-types = [
  { path = "std::collections::HashMap", reason = "Use uf_infra::FxHashMap" },
  { path = "std::collections::HashSet", reason = "Use uf_infra::FxHashSet" },
  { path = "std::rc::Rc", reason = "Prefer references or arena allocation" },
  { path = "std::sync::Arc", reason = "Prefer scoped references; introduce Arc only with an ownership proof" },
]
