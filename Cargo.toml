[workspace]
members = [
  "crates/uf_bundle",
  "crates/uf_check",
  "crates/uf_cli",
  "crates/uf_config",
  "crates/uf_flow",
  "crates/uf_fmt",
  "crates/uf_infra",
  "crates/uf_lib",
  "crates/uf_lint",
  "crates/uf_plugin",
  "crates/uf_pm",
  "crates/uf_prepare",
  "crates/uf_project",
  "crates/uf_react_compiler",
  "crates/uf_rm",
  "crates/uf_router",
  "crates/uf_rsc",
  "crates/uf_runtime",
  "crates/uf_std",
  "crates/uf_stylex",
  "crates/uf_term",
  "crates/uf_test",
  "crates/uf_transform",
  "crates/uf_tui",
]
exclude = ["upstream"]
resolver = "3"

[workspace.package]
authors = ["uniflowed contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ubugeeei-prod/uf"
rust-version = "1.98"
version = "0.0.0-alpha.2"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.1.1"
bumpalo = { version = "3.19.1", features = ["collections"] }
brotli = { version = "8.0.4", default-features = false, features = ["std"] }
camino = { version = "1.2.1", features = ["serde1"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
compact_str = { version = "0.10.0", features = ["serde"] }
criterion = "0.8.2"
dupe = "0.9.1"
flow_aloc = { path = "upstream/flow/rust_port/crates/flow_aloc" }
flow_common = { path = "upstream/flow/rust_port/crates/flow_common" }
flow_common_errors = { path = "upstream/flow/rust_port/crates/flow_common_errors" }
flow_flowlib = { path = "upstream/flow/rust_port/crates/flow_flowlib" }
flow_lint_settings = { path = "upstream/flow/rust_port/crates/flow_lint_settings" }
flow_parser = { path = "upstream/flow/rust_port/crates/flow_parser" }
oxc_allocator = "0.147.0"
oxc_codegen = "0.147.0"
oxc_parser = "0.147.0"
oxc_semantic = "0.147.0"
oxc_sourcemap = "8.1.2"
oxc_span = "0.147.0"
oxc_transformer = "0.147.0"
flow_parser_utils = { path = "upstream/flow/rust_port/crates/flow_parser_utils" }
flow_parsing = { path = "upstream/flow/rust_port/crates/flow_parsing" }
flow_type_sig = { path = "upstream/flow/rust_port/crates/flow_type_sig" }
flow_typing = { path = "upstream/flow/rust_port/crates/flow_typing" }
flow_typing_context = { path = "upstream/flow/rust_port/crates/flow_typing_context" }
flow_typing_errors = { path = "upstream/flow/rust_port/crates/flow_typing_errors" }
flow_typing_type = { path = "upstream/flow/rust_port/crates/flow_typing_type" }
flow_typing_utils = { path = "upstream/flow/rust_port/crates/flow_typing_utils" }
flow_utils_concurrency = { path = "upstream/flow/rust_port/crates/flow_utils_concurrency" }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
ignore = "0.4.25"
indexmap = "2"
json5 = "1.3.1"
memchr = "2.7.6"
mimalloc = "0.1.52"
phf = { version = "0.14.0", features = ["macros"] }
react_compiler = "0.1.0"
react_compiler_ast = "0.1.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
similar-asserts = "2.0.0"
simdutf8 = "0.1.5"
smallvec = { version = "1.15.1", features = ["serde"] }
tempfile = "3.25.0"
thiserror = "2.0.17"
toml = "1.1.4"
unicode-width = "0.2.2"
walkdir = "2.5.0"

# A debug build of this workspace used to need 20 GB, and the machine it was
# built on ran out of disk before it finished linking. Almost all of that was
# debug info for code nobody steps through: `upstream/flow` is Meta's parser
# and type checker, vendored whole, and it is by far the largest thing here.
#
# So dependencies get none, and uf's own crates get line tables — which is
# what a backtrace actually reads. `debug = true` gives a debugger local
# variables as well; a contributor who wants that can turn it back on for the
# one crate they are in, and pay for it there rather than everywhere.
# Incremental is off for the same reason, and it is the larger half: its cache
# reached 10 GB, and the six biggest entries in it were `flow_typing_utils`,
# `flow_typing`, `flow_typing_statement`, `flow_typing_flow_js`,
# `flow_typing_flow_common` and `flow_parser` — 2.5 GB between them, all of it
# caching rebuilds of a submodule that changes only on an upstream sync.
#
# Cargo has no per-package switch for it, so this is all or nothing, and off is
# the right side: the crates that would benefit are the two or three uf's own
# work touches, and a full rebuild of one of those is under a minute. Set
# `CARGO_INCREMENTAL=1` for a session spent inside a single crate.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# Build scripts and proc macros are compile-time only: nothing steps through
# them, and there are a great many of them in the vendored tree.
[profile.dev.build-override]
debug = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"
strip = "symbols"

[profile.release.build-override]
codegen-units = 1
opt-level = 3

[profile.dist]
inherits = "release"
# Release jobs build on every supported architecture. Thin LTO keeps the
# installable binaries optimized while avoiding the peak memory of one huge
# fat-LTO codegen unit on hosted arm64 runners.
codegen-units = 16
lto = "thin"

[profile.dist.build-override]
codegen-units = 16
opt-level = 3

[profile.bench]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.ci]
inherits = "dev"
codegen-units = 256
debug = false
incremental = false

[profile.ci-opt]
inherits = "release"
codegen-units = 16
lto = "thin"
