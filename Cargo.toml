[workspace]
members = [
  "crates/uf_browser",
  "crates/uf_bundle",
  "crates/uf_cli",
  "crates/uf_config",
  "crates/uf_devserver",
  "crates/uf_effect",
  "crates/uf_fetch",
  "crates/uf_flow",
  "crates/uf_fmt",
  "crates/uf_graphql",
  "crates/uf_infra",
  "crates/uf_lib",
  "crates/uf_lint",
  "crates/uf_loader",
  "crates/uf_markdown",
  "crates/uf_mock",
  "crates/uf_motion",
  "crates/uf_orm",
  "crates/uf_package",
  "crates/uf_plugin",
  "crates/uf_pm",
  "crates/uf_prepare",
  "crates/uf_project",
  "crates/uf_rm",
  "crates/uf_router",
  "crates/uf_rsc",
  "crates/uf_runtime",
  "crates/uf_state",
  "crates/uf_story",
  "crates/uf_std",
  "crates/uf_stdlib_cli",
  "crates/uf_term",
  "crates/uf_test",
  "crates/uf_temporal",
  "crates/uf_tui",
  "crates/uf_validator",
  "crates/uf_vrt",
  "crates/uf_web",
]
exclude = ["upstream"]
resolver = "3"

[workspace.package]
authors = ["uniflowed contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ubugeeei-prod/uf"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.1.1"
bumpalo = { version = "3.19.1", features = ["collections"] }
brotli = { version = "8.0.4", default-features = false, features = ["std"] }
camino = { version = "1.2.1", features = ["serde1"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
compact_str = { version = "0.10.0", features = ["serde"] }
criterion = "0.8.2"
flow_parser = { path = "upstream/flow/rust_port/crates/flow_parser" }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
flowjs-parser = "0.0.0-alpha.3"
ignore = "0.4.25"
json5 = "1.3.1"
memchr = "2.7.6"
mimalloc = "0.1.52"
phf = { version = "0.14.0", features = ["macros"] }
rayon = "1.11.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
similar-asserts = "2.0.0"
simdutf8 = "0.1.5"
smallvec = { version = "1.15.1", features = ["serde"] }
tempfile = "3.25.0"
thiserror = "2.0.17"
toml = "1.1.4"
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"
strip = "symbols"

[profile.release.build-override]
codegen-units = 1
opt-level = 3

[profile.bench]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.ci]
inherits = "dev"
codegen-units = 256
debug = false
incremental = false

[profile.ci-opt]
inherits = "release"
codegen-units = 16
lto = "thin"
