# uf for Zed.
#
# This is the manifest half of a Zed extension. Zed has no way to add an
# arbitrary language server from settings, so the language server has to arrive
# as an extension, and an extension that provides one is a Rust crate compiled
# to WebAssembly. `src/lib.rs` is that half; CI tests it on the host, and
# packages it with Zed's own `zed-extension`, which builds it for
# `wasm32-wasip2` as Zed does.
#
# Install with Zed's "Install Dev Extension" against this directory.

id = "uf"
name = "uf"
version = "0.0.0"
schema_version = 1
authors = ["uniflowed contributors"]
description = "Flow diagnostics, formatting, quick fixes and hover from the uf toolchain."
repository = "https://github.com/ubugeeei-prod/uf"

[language_servers.uf]
name = "uf"
# Zed's own language name. Zed files `.js`, `.jsx`, `.mjs` and `.cjs` all under
# JavaScript — the four extensions `uf_lint`'s `flow/syntax` parses. It has no
# separate JSX language, and a name it does not know attaches the server to
# nothing.
languages = ["JavaScript"]
